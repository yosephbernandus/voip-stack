[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voip-stack"
version = "0.1.0"
description = "A working VoIP stack built from scratch in Python: SIP, SDP, RTP, and a jitter buffer, with a browser client for a live call"
requires-python = ">=3.12"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.0",
    "websockets>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
native = [
    "maturin>=1.7,<2.0",
]

[tool.setuptools]
packages = ["voip", "voip.types"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
