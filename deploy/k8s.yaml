# Example Kubernetes manifest. Replace the image reference and the ingress
# host with your own before applying. TURN credentials are optional and are
# pulled from a Secret at runtime, never committed here.
#
#   kubectl apply -f deploy/k8s.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: voip-stack
  labels:
    app: voip-stack
spec:
  # This must stay at 1. The user registry and the call dialogs live in
  # process memory, so a second replica would split users across pods and
  # calls between them would return 404.
  replicas: 1
  selector:
    matchLabels:
      app: voip-stack
  template:
    metadata:
      labels:
        app: voip-stack
    spec:
      containers:
      - name: voip-stack
        image: your-registry/voip-stack:latest
        ports:
        - containerPort: 8080
        # NAT traversal. STUN alone is enough for direct peer-to-peer media.
        # Phone-to-phone on isolated wifi or mobile data needs a TURN relay.
        # When these credentials are present, the server mints short-lived
        # TURN credentials per registration and delivers them in the
        # "registered" reply. ICE_SERVERS is a static fallback for a TURN
        # setup that does not use the minting API.
        env:
        - name: TURN_KEY_ID
          valueFrom:
            secretKeyRef:
              name: voip-stack-turn
              key: key-id
              optional: true
        - name: TURN_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: voip-stack-turn
              key: api-token
              optional: true
        - name: ICE_SERVERS
          valueFrom:
            secretKeyRef:
              name: voip-stack-ice
              key: ice-servers
              optional: true
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 20
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 3
          periodSeconds: 10
          timeoutSeconds: 3
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: voip-stack-service
spec:
  selector:
    app: voip-stack
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: voip-stack-ingress
spec:
  rules:
  - host: voip.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: voip-stack-service
            port:
              number: 80
